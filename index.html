<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alliance Knowledge Repository</title>

<!-- Set this to the Apps Script deployment for this environment. -->
<script>
const CONFIG = { ENDPOINT: "https://script.google.com/macros/s/AKfycbwH6Asd_1JreIcbSTiKfESkd1dm2j5OIcA4a_q1iRPatTgT0V74XHabtrOV4z4a0Tc/exec" };
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#FFFFFF; --ground:#ECF0F2; --surface:#F7F9FA;
  --ink:#12161A; --ink-soft:#5A6672; --ink-faint:#8A949E;
  --rule:#DFE5E8; --rule-soft:#EBEFF1;
  --accent:#006E8A; --accent-deep:#005267; --accent-2:#00A883; --accent-3:#ABD328;
  --warn:#9A3412; --warn-bg:#FDF3EF;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);
  background-image:radial-gradient(circle at 1px 1px, rgba(18,22,26,.045) 1px, transparent 0);
  background-size:22px 22px;
  color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.page{max-width:620px;margin:0 auto;padding:40px 20px 72px}
@media (max-width:600px){ .page{padding:16px 12px 56px} }

.card{background:var(--paper);border:1px solid var(--rule);border-radius:8px;overflow:hidden;
  box-shadow:0 1px 2px rgba(18,22,26,.04), 0 18px 40px -28px rgba(18,22,26,.28)}
.tri{display:flex;height:3px}
.tri i{flex:1}
.tri i:nth-child(1){background:var(--accent)}
.tri i:nth-child(2){background:var(--accent-2)}
.tri i:nth-child(3){background:var(--accent-3)}

.masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:20px 26px 16px}
@media (max-width:600px){ .masthead{padding:16px 16px 12px} }
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{display:block;height:26px;width:auto}
.wordmark{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink);line-height:1.45}
.chip{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-faint);background:var(--surface);border:1px solid var(--rule-soft);
  border-radius:4px;padding:5px 8px;white-space:nowrap;flex:none;text-align:right;line-height:1.2}
.chip b{display:block;color:var(--accent);font-weight:600;font-size:11.5px;letter-spacing:.03em;margin-top:1px}
.chip[hidden]{display:none}

/* ---------- tabs ---------- */
.tabs{display:flex;border-bottom:1px solid var(--rule);padding:0 26px;gap:2px}
@media (max-width:600px){ .tabs{padding:0 8px} }
.tab{flex:1;background:none;border:0;cursor:pointer;padding:0 4px 12px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);position:relative;min-height:44px;transition:color .15s ease}
.tab:hover{color:var(--ink-soft)}
.tab .num{display:block;font-size:9px;opacity:.6;margin-bottom:2px}
.tab[aria-selected=true]{color:var(--accent);font-weight:600}
.tab[aria-selected=true]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;
  height:2px;background:var(--accent);border-radius:2px 2px 0 0}
.tab:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}

.panel{padding:26px}
@media (max-width:600px){ .panel{padding:20px 16px} }
.panel[hidden]{display:none}

h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
.sub{font-size:13.5px;color:var(--ink-soft);margin:0 0 20px}

/* ---------- pick lists (tab 1) ---------- */
.backbar{display:flex;align-items:center;gap:12px;margin:16px 0 18px}
.backbar[hidden]{display:none}
.back{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;
  background:var(--surface);border:1px solid var(--rule);border-radius:5px;cursor:pointer;
  font-family:var(--sans);font-size:14px;color:var(--ink);
  transition:border-color .15s ease,background .15s ease}
.back:hover{border-color:var(--accent);background:var(--paper)}
.back:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,110,138,.13)}
.here{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-faint);min-width:0;word-break:break-word;line-height:1.5}

.pick{display:block;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--rule);border-radius:5px;padding:13px 14px;margin-bottom:7px;
  cursor:pointer;font-family:var(--sans);font-size:15px;color:var(--ink);
  transition:border-color .15s ease,background .15s ease}
.pick:hover{border-color:var(--accent);background:var(--paper)}
.pick:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,110,138,.13)}
.pick b{display:block;font-weight:500}
.pick i{display:block;font-style:normal;font-family:var(--mono);font-size:10px;
  color:var(--ink-faint);margin-top:3px;letter-spacing:.03em}
.pick.add{background:var(--paper);border-style:dashed;color:var(--accent)}
.pick.add:hover{background:var(--surface)}
.pick.upload{background:var(--accent);border-color:var(--accent);color:#fff}
.pick.upload:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.pick.upload i{color:rgba(255,255,255,.78)}

/* ---------- destination ---------- */
.dest{border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-top:4px}
.dest-top{background:var(--surface);padding:16px;border-bottom:1px solid var(--rule)}
.dest-path{font-family:var(--mono);font-size:13px;color:var(--ink);font-weight:600;word-break:break-word}
.dest-body{padding:16px}
.rename{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin:0 0 4px}
.rename b{display:block;color:var(--ink);margin-top:5px;font-weight:400;word-break:break-word}

/* ---------- fields ---------- */
.f{margin-bottom:18px}
.f:last-child{margin-bottom:0}
label,.lab{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px;font-weight:500}
input[type=text],input[type=url],input[type=search],select,textarea{
  width:100%;font-family:var(--sans);font-size:16px;color:var(--ink);
  background:var(--surface);border:1px solid var(--rule);border-radius:5px;
  padding:12px 13px;line-height:1.4;appearance:none;-webkit-appearance:none;
  transition:border-color .15s ease,box-shadow .15s ease,background .15s ease}
input::placeholder,textarea::placeholder{color:var(--ink-faint)}
textarea{resize:vertical;min-height:84px}
select{cursor:pointer;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='11' height='7'%3E%3Cpath d='M1 1.5l4.5 4 4.5-4' fill='none' stroke='%235A6672' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:36px}
input:hover,select:hover,textarea:hover{border-color:#CBD4D9}
input:focus,select:focus,textarea:focus{outline:none;background:var(--paper);
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,110,138,.13)}
.help{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:7px;line-height:1.55}
.err{font-family:var(--mono);font-size:10.5px;color:var(--warn);margin-top:7px;line-height:1.55;
  display:none;background:var(--warn-bg);border-left:2px solid var(--warn);padding:6px 9px;
  border-radius:0 3px 3px 0}
.f.bad .err{display:block}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--warn);background:var(--paper)}
.f.bad .help{display:none}
.f.bad .ticks{border-color:var(--warn)}

.ticks{border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.tick{display:flex;align-items:center;gap:11px;padding:11px 13px;cursor:pointer;
  background:var(--surface);min-height:44px;margin:0;font-family:var(--sans);font-size:15px;
  letter-spacing:0;text-transform:none;color:var(--ink)}
.tick + .tick{border-top:1px solid var(--rule)}
.tick input{width:16px;height:16px;accent-color:var(--accent);flex:none;margin:0}
.locked{font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--rule);
  border-radius:5px;padding:12px 13px;color:var(--ink-soft)}

.seg{display:flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.seg label{flex:1;margin:0;padding:0;cursor:pointer;font-family:var(--sans);font-size:13px;
  text-transform:none;letter-spacing:0;color:var(--ink)}
.seg label + label{border-left:1px solid var(--rule)}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:flex;align-items:center;justify-content:center;min-height:44px;
  background:var(--surface);padding:0 6px}
.seg input:checked + span{background:var(--accent);color:#fff}
.seg input:focus-visible + span{box-shadow:inset 0 0 0 2px var(--ink)}


/* ---------- tappable choices and keyword browser ---------- */
.choicebox,.meta-browser{border:1px solid var(--rule);border-radius:6px;background:var(--paper);padding:13px}
.f.bad .choicebox,.f.bad .meta-browser{border-color:var(--warn)}
.choice-grid{display:flex;flex-wrap:wrap;gap:8px}
.choice{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:8px 11px;
  border:1px solid var(--rule);border-radius:999px;background:var(--surface);color:var(--ink);
  cursor:pointer;font-family:var(--sans);font-size:13.5px;line-height:1.25;text-align:left;
  transition:border-color .15s ease,background .15s ease,color .15s ease,transform .08s ease}
.choice:hover{border-color:var(--accent);background:var(--paper)}
.choice:active{transform:translateY(1px)}
.choice[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.choice[aria-pressed=true]::before{content:"\2713";font-size:11px;font-weight:700}
.choice:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(0,110,138,.14)}

.selected-box{background:var(--surface);border:1px solid var(--rule-soft);border-radius:5px;padding:10px;margin-bottom:12px}
.selected-title{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:7px}
.selected-list{display:flex;flex-wrap:wrap;gap:6px}
.selected-pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;
  background:var(--accent);color:#fff;padding:5px 8px;font-family:var(--sans);font-size:12px;cursor:pointer}
.selected-pill span{opacity:.72;font-size:13px}
.selected-pill:hover{background:var(--accent-deep)}

.meta-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px}
@media (max-width:440px){.meta-tabs{grid-template-columns:1fr 1fr;gap:6px}.meta-tab{font-size:12px;padding:8px}}
.meta-tab{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px;
  padding:9px 11px;border:1px solid var(--rule);border-radius:5px;background:var(--surface);
  color:var(--ink);cursor:pointer;font-family:var(--sans);font-size:13px;text-align:left}
.meta-tab:hover{border-color:var(--accent);background:var(--paper)}
.meta-tab[aria-expanded=true]{border-color:var(--accent);background:var(--paper);color:var(--accent);font-weight:600}
.meta-tab b{font-family:var(--mono);font-size:9px;font-weight:600;background:var(--paper);
  border:1px solid var(--rule);border-radius:999px;min-width:20px;padding:2px 5px;text-align:center;color:var(--ink-soft)}
.meta-tab[aria-expanded=true] b{border-color:rgba(0,110,138,.25);color:var(--accent)}
.meta-panel{margin-top:9px;border:1px solid var(--rule-soft);border-radius:5px;padding:12px;background:var(--surface)}
.meta-panel-title{font-size:13.5px;font-weight:600;margin:0 0 9px}
.meta-note{font-family:var(--mono);font-size:10px;color:var(--ink-faint);line-height:1.5;margin:0 0 9px}
.inline-add{display:flex;gap:7px;margin-top:10px}
.inline-add input{min-width:0;flex:1;font-size:14px;padding:9px 10px;background:var(--paper)}
.mini{flex:none;border:1px solid var(--accent);border-radius:5px;background:var(--paper);color:var(--accent);
  padding:0 12px;min-height:40px;font-family:var(--sans);font-size:13px;cursor:pointer}
.mini:hover{background:var(--accent);color:#fff}
.inline-msg{font-family:var(--mono);font-size:10px;line-height:1.5;margin-top:7px;color:var(--ink-faint)}
.inline-msg.badmsg{color:var(--warn)}
.custom-keyword{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule-soft)}
.custom-keyword .custom-title{font-size:13px;font-weight:600;margin-bottom:7px}

.retrieve-help{font-size:13px;color:var(--ink-soft);margin:8px 0 0;line-height:1.5}
.retrieve-tools{margin-top:18px}
.filter-section{border-top:1px solid var(--rule-soft);padding-top:16px;margin-top:16px}
.filter-section:first-child{border-top:0;padding-top:0;margin-top:0}
.filter-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:9px}
.filter-heading strong{font-size:14px;font-weight:600}
.filter-heading span{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint)}
.quick-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
@media (max-width:440px){.quick-tabs{grid-template-columns:1fr 1fr;gap:6px}.quick-tabs .meta-tab{font-size:12px;padding:8px}}
.quick-panel{margin-top:9px;border:1px solid var(--rule-soft);border-radius:5px;padding:12px;background:var(--surface)}
.filter-reset{display:inline-flex;border:0;background:none;color:var(--accent);padding:0;margin-top:10px;
  font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.filter-reset:hover{text-decoration:underline}

/* ---------- buttons ---------- */
.go{width:100%;min-height:50px;background:var(--accent);color:#fff;border:0;border-radius:5px;
  font-family:var(--sans);font-size:15.5px;font-weight:500;cursor:pointer;
  transition:background .15s ease,transform .08s ease;display:flex;align-items:center;
  justify-content:center;gap:8px;text-decoration:none}
.go:hover{background:var(--accent-deep)}
.go:active{transform:translateY(1px)}
.go:disabled{opacity:.5;cursor:default;transform:none}
.go:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.go.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--rule)}
.go.ghost:hover{background:var(--surface);border-color:var(--accent)}
.stackbtn{display:grid;gap:9px;margin-top:16px}
.formerr{font-family:var(--mono);font-size:10.5px;color:var(--warn);margin-top:13px;
  line-height:1.6;display:none;text-align:center}
.formerr.on{display:block}
.note{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);line-height:1.6;margin:14px 0 0}
.warnbox{font-family:var(--mono);font-size:11px;color:var(--warn);background:var(--warn-bg);
  border-left:2px solid var(--warn);padding:10px 12px;border-radius:0 3px 3px 0;margin:0 0 14px;line-height:1.6}

/* ---------- record: chosen folder strip ---------- */
.strip{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--surface);border:1px solid var(--rule);border-radius:5px;
  padding:11px 13px;margin-bottom:22px}
.strip .p{font-family:var(--mono);font-size:11px;color:var(--ink);word-break:break-word;line-height:1.5}
.strip button{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);flex:none;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.strip button:hover{text-decoration:underline}

.empty{text-align:center;padding:26px 0}
.empty p{font-size:14px;color:var(--ink-soft);margin:0 0 18px}

/* ---------- record stub ---------- */
.stub-kicker{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-2);font-weight:600}
.stub-id{font-family:var(--mono);font-size:32px;letter-spacing:.01em;color:var(--ink);
  margin:8px 0 22px;font-weight:600}
.perf{border-top:1px dashed var(--rule);margin-bottom:4px}
.row{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--rule-soft);font-size:14px}
.row:last-of-type{border-bottom:0}
.row dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-faint);width:78px;flex:none;padding-top:4px}
.row dd{margin:0;min-width:0;word-break:break-word}

/* ---------- retrieve ---------- */
.searchwrap{position:relative}
.eg{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin:9px 0 0;line-height:1.7}
.eg button{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);
  font-family:var(--mono);font-size:10px}
.eg button:hover{text-decoration:underline}
.readback{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:16px 0 0}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;
  border:0;border-radius:4px;padding:5px 8px;font-family:var(--mono);font-size:10px;
  letter-spacing:.04em;cursor:pointer}
.fchip:hover{background:var(--accent-deep)}
.fchip em{font-style:normal;opacity:.7;font-size:11px}
.fchip.free{background:var(--surface);color:var(--ink-soft);border:1px solid var(--rule)}
.count{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-left:auto;
  letter-spacing:.06em;text-transform:uppercase}
.banner{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);background:var(--surface);
  border:1px solid var(--rule);border-radius:5px;padding:9px 11px;margin:16px 0 0;line-height:1.6}

.results{display:grid;gap:12px;margin:14px 0}
.res{padding:18px;border:1px solid var(--rule);border-radius:8px;overflow-wrap:anywhere}
.res h3{font-size:19px;line-height:1.35;margin:0 0 5px;color:var(--ink)}
.res .meta,.res .keywords{font-size:12px;color:var(--ink-soft);margin:4px 0}
.res .folder-path{font-size:13px;font-weight:600;margin:6px 0;color:var(--ink)}
.res .desc{font-size:14px;margin:10px 0;color:var(--ink-soft)}
.res .acts{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;margin-top:14px}
.res .acts a,.res .acts button,.folder-link{font:inherit;font-size:14px;color:var(--accent);cursor:pointer}
.res .acts button{border:0;background:transparent}
.res .acts a,.res .acts button{display:inline-flex;align-items:center;min-height:44px}
.res .acts .open-file{background:var(--accent);color:white;border-radius:5px;padding:0 16px;text-decoration:none;font-weight:600}
#accessForm input,.dest-body input[type=file]{display:block;margin:8px 0 14px;max-width:100%}
#p-admin .go{margin:4px 8px 4px 0}
.keyword-loading{display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--ink);font-weight:600}
.keyword-loading::before{content:"";width:1em;height:1em;border:2px solid var(--rule);border-top-color:var(--accent);border-radius:50%;animation:keyword-spin .8s linear infinite}
@keyframes keyword-spin{to{transform:rotate(360deg)}}
.banner .go{display:block;margin-top:8px}
[hidden]{display:none!important}
@media(max-width:420px){.res{padding:14px}.tab .num{display:none}.tab{letter-spacing:0}.res .acts{gap:4px 12px}}
.old{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--warn);background:var(--warn-bg);border-radius:3px;
  padding:2px 6px;margin-left:6px;vertical-align:middle}
.rel{margin-top:12px;padding:12px 14px;background:var(--surface);border-radius:5px;
  border-left:2px solid var(--accent-2)}
.rel[hidden]{display:none}
.rel .r{padding:7px 0;border-bottom:1px solid var(--rule-soft);font-size:13.5px}
.rel .r:last-child{border-bottom:0}
.rel .r a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
.rel .r a:hover{border-bottom-color:var(--accent)}
.rel .why{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);margin-top:3px;letter-spacing:.03em}

.spin{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);text-align:center;padding:26px 0;
  letter-spacing:.08em;text-transform:uppercase}

.foot{text-align:center;margin-top:18px;font-family:var(--mono);font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important} }
.tabs .tab{font:600 15px var(--sans);letter-spacing:0;text-transform:none}.tab[aria-current=page]{color:var(--accent);border-bottom:3px solid var(--accent)}
.page{max-width:720px}.panel h2{font:600 clamp(23px,4vw,30px)/1.2 var(--sans);letter-spacing:-.035em;margin:0 0 20px}
.drop-zone{border:1px dashed var(--accent);border-radius:8px;background:var(--surface);padding:18px;display:flex;align-items:center;gap:12px;position:relative;flex-wrap:wrap;overflow-wrap:anywhere}
.drop-zone strong{color:var(--accent)}.drop-zone span,.folder-path{color:var(--ink-soft);font-size:13px}
.drop-zone input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.drop-zone:focus-within,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.disclosure{border:1px solid var(--rule);border-radius:7px;margin:12px 0;padding:0 14px}.disclosure summary,.result-menu summary,.admin-menu summary{cursor:pointer;padding:10px 0;color:var(--ink);font-size:14px}
.disclosure[open]{padding-bottom:12px}.destination summary strong{display:block;color:var(--accent);margin:3px 0 0}
.err-file{color:var(--warn);margin:4px 0;font-size:13px}.admin-menu{position:relative}.admin-menu button{position:absolute;right:0;z-index:3;min-width:150px;padding:12px;background:var(--paper);border:1px solid var(--rule);border-radius:5px}
progress{display:block;width:100%;accent-color:var(--accent)}.text-action,.result-menu button{background:transparent;border:0;color:var(--accent);cursor:pointer;padding:12px}
.res .acts .result-menu{margin-left:auto}.result-menu[open] a,.result-menu[open] button{display:block}.saved-title{overflow-wrap:anywhere}
#recForm .f{margin-top:14px}#recForm .f>label{font-size:13px;text-transform:none;letter-spacing:0}#go:disabled{opacity:.55}
</style>
</head>

<script>
(function(){
"use strict";

/* ============================================================
   VOCABULARY
   ============================================================ */

/* Only these seven main folders are fixed. Every folder below them is created
   by the operator as needed, including folders inside folders. */
var LIBS = [
  { id:"01 Clients",       desc:"files for one specific client", kind:"client" },
  { id:"02 Content",       desc:"reusable learning and delivery material", kind:"folder" },
  { id:"03 Market & Sell", desc:"material used to win work", kind:"folder" },
  { id:"04 People",        desc:"facilitators and team members", kind:"person" },
  { id:"05 Research",      desc:"research and reference material", kind:"folder" },
  { id:"06 Alliance IP",   desc:"Alliance frameworks, tools and methods", kind:"folder" },
  { id:"99 Archive",       desc:"old or replaced material", kind:"folder" }
];

var DOCTYPES = [
  ["Commercial",        ["Proposal","Contract / SOW","Pricing Document"]],
  ["Delivery material", ["Slide Deck","Workbook","Facilitator Guide","Activity","Assessment","Case Study"]],
  ["Written",           ["Report","Article","Meeting Notes"]],
  ["Media",             ["Video","Image / Brand Asset"]],
  ["Reusable",          ["Template","Framework","Prompt"]],
  ["People",            ["CV / Biography","Feedback"]],
  ["Anything else",     ["Other"]]
];
var FLAT_DOCTYPES = [];
DOCTYPES.forEach(function(g){ g[1].forEach(function(d){ FLAT_DOCTYPES.push(d); }); });

var INDUSTRIES = ["Government","Healthcare","Banking & Finance","Education","Energy",
                  "Technology","Manufacturing","Retail","Logistics","Other"];
var TAG_GROUPS = [
  {key:"topic", label:"Topic"}, {key:"purpose", label:"What is it for?"},
  {key:"audience", label:"Who is it for?"}, {key:"usage", label:"How is it used?"},
  {key:"features", label:"Style and features"}, {key:"region", label:"Region"},
  {key:"language", label:"Language"}, {key:"custom", label:"Other keywords"}
];
TAG_GROUPS.forEach(function(g){ g.values = []; });
const keywordOrder = new Intl.Collator("en", {sensitivity:"base", numeric:true});
const displayTagGroups = TAG_GROUPS.slice().sort((a,b) => keywordOrder.compare(a.label,b.label));
var TAG_GROUP_MAP = {};
TAG_GROUPS.forEach(function(g){ TAG_GROUP_MAP[g.key] = g; });

var QUICK_FILTERS = [
  { key:"client", label:"Client" },
  { key:"docType", label:"Document Type" },
  { key:"fileFormat", label:"File Format" },
  { key:"fileSize", label:"File Size" },
  { key:"year", label:"Year" }
];

/* ============================================================
   STATE
   ============================================================ */

var S = {
  clients: [],        // {name, industry, url}
  people:  [],        // {name, language, url}
  topics:  [],
  folders: {},        // "path" -> url
  next:    "",
  dest:    null,      // {library, folderPath, client, person, url}
  nav:     { lib:null, path:"" },
  records: null,      // lazy
  loadingRecords: false,
  lastQuery: "",
  removed: [],        // typed facets the user dismissed
  record: null,
  retrieve: { filters:[], activeQuick:"", activeTag:"" }
};

function $(id){ return document.getElementById(id); }
function el(tag, cls, txt){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; });
}
function live(){ return /^https:\/\//.test(CONFIG.ENDPOINT); }

var accessKey = "";
class DriveStorageError extends Error {
  constructor(){
    super("There isn’t enough space in the repository’s Google Drive for this file. Ask the Drive owner to free up space, then select Retry.");
  }
}
async function api(action, payload){
  if (!live()) throw new Error("The repository connection has not been configured.");
  const response = await fetch(CONFIG.ENDPOINT, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign({}, payload, {action:action, accessKey:accessKey})) });
  if (!response.ok) throw new Error("The repository service could not be reached.");
  const data = await response.json();
  if (!data.ok && data.code === "storageQuotaExceeded") throw new DriveStorageError();
  if (!data.ok) throw new Error(data.error || "The request could not be completed.");
  return data;
}

function uniqueValues(values){
  var out = [], seen = Object.create(null);
  (values || []).forEach(function(v){
    v = norm(v);
    if (!v || seen[key(v)]) return;
    seen[key(v)] = true;
    out.push(v);
  });
  return out;
}
function facetKey(kind, value){ return kind + "|" + key(value); }
function hasPicked(list, kind, value){
  var k = facetKey(kind, value);
  return (list || []).some(function(x){ return facetKey(x.kind, x.value) === k; });
}
function pickedValues(list, kind){
  return (list || []).filter(function(x){ return x.kind === kind; }).map(function(x){ return x.value; });
}
function togglePicked(list, kind, value){
  var k = facetKey(kind, value), found = -1;
  for (var i = 0; i < list.length; i++) if (facetKey(list[i].kind, list[i].value) === k){ found = i; break; }
  if (found > -1) list.splice(found, 1); else list.push({ kind:kind, value:value });
}
function topicValues(){ return S.topics; }
function groupValues(group){ return group.values; }

function pathParts(path){
  var value = norm(path);
  return value ? value.split(" > ").filter(Boolean) : [];
}

function joinPath(parentPath, name){
  return norm(parentPath) ? norm(parentPath) + " > " + norm(name) : norm(name);
}

function lastPathName(path){
  var parts = pathParts(path);
  return parts.length ? parts[parts.length - 1] : "";
}

function firstPathName(path){
  var parts = pathParts(path);
  return parts.length ? parts[0] : "";
}

/* Return only direct children of the selected folder. The Folders map can
   contain any depth, but deeper descendants are shown only after opening their
   parent. */
function folderChildren(library, parentPath){
  var out = [];
  var seen = {};
  var prefix = library + " > " + (parentPath ? parentPath + " > " : "");

  [S.folders || {}].forEach(function(map){
    Object.keys(map).forEach(function(path){
      if (path.indexOf(prefix) !== 0) return;
      var rest = path.slice(prefix.length);
      if (!rest || rest.indexOf(" > ") !== -1 || seen[key(rest)]) return;
      seen[key(rest)] = true;
      out.push(rest);
    });
  });

  /* Keep client/person folders visible even if an older Folders sheet has not
     yet been rebuilt. */
  if (!parentPath && library === "01 Clients"){
    S.clients.forEach(function(c){ if (!seen[key(c.name)]){ seen[key(c.name)] = true; out.push(c.name); } });
  }
  if (!parentPath && library === "04 People"){
    S.people.forEach(function(p){ if (!seen[key(p.name)]){ seen[key(p.name)] = true; out.push(p.name); } });
  }

  return out.sort(function(a,b){ return a.localeCompare(b); });
}

/* Backward-compatible helpers retained for tests and maintenance tools. */
function folderNames(L){ return folderChildren(L.id, ""); }
function clientFolderNames(client){ return folderChildren("01 Clients", client); }

function childNote(L, parentPath, name){
  if (!parentPath && L.id === "01 Clients"){
    var c = S.clients.filter(function(x){ return key(x.name) === key(name); })[0];
    return c && c.industry ? c.industry : "Open client folder";
  }
  if (!parentPath && L.id === "04 People"){
    var p = S.people.filter(function(x){ return key(x.name) === key(name); })[0];
    return p && p.language ? p.language : "Open person folder";
  }
  return "Open folder";
}

function destinationExtra(library, folderPath){
  var first = firstPathName(folderPath);
  if (library === "01 Clients") return { client:first };
  if (library === "04 People") return { person:first };
  return {};
}

function renderPicker(){
  backbar();

  box.innerHTML = "";

  /* Level 0 — the seven fixed main folders. */
  if (!S.nav.lib){
    LIBS.forEach(function(L){
      box.appendChild(pickButton(L.id, L.desc, function(){

     This prevents loose files from collecting in the seven main folders. */

}

/* ---- create a client or a person, without leaving the page ---- */

function norm(s){ return String(s || "").trim().replace(/\s+/g, " "); }
function key(s){ return norm(s).toLowerCase(); }

function lev(a, b){
  a = key(a); b = key(b);
  var m = a.length, n = b.length, i, j, prev = [], cur = [];
  if (!m) return n;
  if (!n) return m;
  for (j = 0; j <= n; j++) prev[j] = j;
  for (i = 1; i <= m; i++){
    cur[0] = i;
    for (j = 1; j <= n; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    prev = cur.slice();
  }
  return prev[n];
}

/* An exact duplicate is blocked outright. A near-duplicate needs a second,
   explicit click — because two spellings of one client silently split the
   index in half and nobody notices for months. */
function nearMatch(name, list){
  var k = key(name);
  for (var i = 0; i < list.length; i++){
    var other = list[i].name, ok2 = key(other);
    if (ok2 === k) return { exact:true, name:other };
    if (ok2.indexOf(k) === 0 || k.indexOf(ok2) === 0) return { exact:false, name:other };
    if (lev(k, ok2) <= 2) return { exact:false, name:other };
  }
  return null;
}

          ? err.message.replace(/^Error:\s*/, "")
          : "Could not create the folder. Check your connection and try again.";
      });
  });
}

/* ---- destination screen ---- */

function folderTarget(library, folderPath){
  var maps = [S.folders || {}];
  var parts = pathParts(folderPath);

  /* Prefer the exact selected folder. If an old/stale map lacks that URL,
     open the deepest known parent and tell the operator what remains. */
  for (var depth = parts.length; depth >= 0; depth--){
    var relative = parts.slice(0, depth).join(" > ");
    var keyPath = library + (relative ? " > " + relative : "");
    for (var m = 0; m < maps.length; m++){
      var url = maps[m][keyPath];
      if (url){
        return {
          url:url,
          label:relative ? lastPathName(relative) : library,
          openPath:parts.slice(depth).join(" > "),
          exact:depth === parts.length
        };
      }
    }
  }
  return { url:"", label:library, openPath:folderPath, exact:false };
}

function folderUrl(library, folderPath){
  return folderTarget(library, folderPath || "").url;
}

function currentDraft(){
  return S.record && $("recForm") ? {title:$("title").value,desc:$("desc").value,record:S.record,
    client:$("client")?.value,industry:$("industry")?.value,people:ticked("person")} : null;
}
function choose(library, folderPath, extra){
  const draft = currentDraft();
  const target = folderTarget(library, folderPath);
  S.dest = Object.assign({library,folderPath,url:target.url,exactFolder:target.exact},extra);
  $("folderCaption").textContent = library+" › "+pathParts(folderPath).join(" › ");
  $("changeFolder").hidden = false;
  $("folderPicker").open = false;
  renderRecord(draft);
}

const FILE_LIMIT = 1000000000;
const CHUNK_BYTES = 16 * 1024 * 1024;
var transfer = null;
function selectFile(file){
  if (S.uploading || (transfer && transfer.id)) return;
  $("fileError").textContent = "";
  if (!file || file.size > FILE_LIMIT) {
    if (file) $("fileError").textContent = "This file is larger than 1 GB. Choose a smaller file.";
    $("uploadFile").value = ""; transfer = null;
    $("fileCaption").textContent = "Choose file"; $("dropHint").textContent = "or drop a file here";
  } else {
    transfer = {file, id:"", session:"", offset:0, complete:false, probe:false};
    $("fileCaption").textContent = file.name; $("dropHint").textContent = "Change file";
    if ($("title")) $("title").value = file.name;
    if (!S.dest) $("folderPicker").open = true;
  }
  refreshSave();
}
$("uploadFile").addEventListener("change", e => selectFile(e.target.files[0]));
["dragover","drop"].forEach(type => $("dropZone").addEventListener(type, e => {
  e.preventDefault();
  if (type === "drop") {
    if (e.dataTransfer.files.length === 1) selectFile(e.dataTransfer.files[0]);
    else $("fileError").textContent = "Choose one file at a time.";
  }
}));

  if (S.dest && S.dest.person){
    var p = S.people.filter(function(x){ return key(x.name) === key(S.dest.person); })[0];

      if (key(p.language) === "english and arabic") return "English & Arabic";
      if (TAG_GROUP_MAP.language.values.indexOf(p.language) > -1) return p.language;

function putChunk(state, probe){
  return new Promise((resolve,reject)=>{
    const file = state.file, start = state.offset, end = Math.min(start + CHUNK_BYTES, file.size);
    const xhr = new XMLHttpRequest();
    xhr.open("PUT",state.session);
    xhr.timeout = 180000;
    if (probe || file.size) xhr.setRequestHeader("Content-Range",probe ? "bytes */"+file.size : "bytes "+start+"-"+(end-1)+"/"+file.size);
    if (!probe) xhr.setRequestHeader("Content-Type",file.type || "application/octet-stream");
    xhr.upload.onprogress = e => { if (!probe) showProgress(start+e.loaded); };
    xhr.onload = () => {
      if (xhr.status === 403) {
        let error;
        try { error = JSON.parse(xhr.responseText).error; } catch (_) {}
        if (Array.isArray(error?.errors) && error.errors.some(e => e?.reason === "storageQuotaExceeded")) {
          reject(new DriveStorageError());
          return;
        }
      }
      resolve({code:xhr.status, range:xhr.getResponseHeader("Range")});
    };
    xhr.onerror = xhr.ontimeout = xhr.onabort = () => reject(new Error("Connection interrupted."));
    xhr.send(probe ? null : file.slice(start,end));
  });
}

async function sendFile(state){
  const file = state.file;
  if (!state.id) state.id = (await api("reserveUpload",{})).id;
  let attempts = 0, renewed = false;
  while (!state.complete){
    if (!state.session){
      const opened = await api("beginUpload",{uploadId:state.id,library:S.dest.library,folderPath:S.dest.folderPath,name:file.name,mime:file.type,size:file.size});
      if (opened.complete){state.complete=true;break;}
      state.session = opened.session; state.offset=0; state.probe=false;
    }
    try {
      const reply = await putChunk(state,state.probe);
      // An earlier final PUT can win after its response was lost. The save
      // endpoint independently checks this reserved ID, byte count and parent.
      if (reply.code === 200 || reply.code === 201 || reply.code === 409){ state.complete=true; break; }
      if (reply.code === 404 || reply.code === 410){
        if (renewed) throw Error("The upload session expired. Retry to reconnect.");
        renewed=true; state.session=""; continue;
      }
      if(reply.code!==308) throw Error("Drive interrupted the upload ("+reply.code+").");
      let offset = reply.range ? Number((/^bytes=0-(\d+)$/i.exec(reply.range)||[])[1])+1 : 0;
      if (!reply.range) {
        // Some browsers cannot read the Range header on a cross-origin response.
        const status=await api("uploadStatus",{session:state.session,size:file.size});
        if(status.complete){state.complete=true;break;}
        offset=status.offset;
      }
      if (!Number.isSafeInteger(offset)||offset<0||offset>file.size) throw Error("Drive returned an invalid upload offset.");
      if(!state.probe && offset<=state.offset) throw Error("Drive has not acknowledged the last part.");
      if(offset>state.offset) attempts=0;
      state.offset=offset; state.probe=false; showProgress(offset);
    } catch(err){
      if (err instanceof DriveStorageError) {
        state.session=""; state.offset=0; state.probe=false;
        throw err;
      }
      state.probe=true;
      if(++attempts>3) throw Error("Upload paused. Keep this tab open and retry when connected.");
      $("saveStatus").textContent = "Reconnecting to Drive…";
      await new Promise(resolve=>setTimeout(resolve,1000*Math.pow(2,attempts-1)));
    }
  }
}

var STOP = {};
"a an and are as at be by can deliver delivers do file files find for from give has have i in is it me my of on or our show that the this to was we what when where which who with you".split(" ").forEach(function(w){ STOP[w] = 1; });

function clean(s){
  return " " + String(s || "").toLowerCase().replace(/[^a-z0-9&\s]/g, " ").replace(/\s+/g, " ").trim() + " ";
}

function parseQuery(q){
  var s = clean(q);
  var found = [];
  FACETS.forEach(function(f){
    var needle = clean(f.p);
    if (needle.trim().length < 2) return;
    if (s.indexOf(needle) > -1){
      for (var i = 0; i < found.length; i++){
        if (found[i].kind === f.kind && found[i].value === f.value) return;
      }
      found.push({ kind:f.kind, value:f.value, source:"typed" });
      s = s.replace(needle, " ");
    }
  });
  var free = [];
  s.split(" ").forEach(function(t){
    if (t && !STOP[t] && t.length > 1 && free.indexOf(t) < 0) free.push(t);
  });
  return { facets:found, free:free };
}

var W = { title:10, tags:9, topics:8, client:9, people:8, docType:6, fileFormat:6,
          fileSize:2, industry:5, description:3, folderPath:2, library:1, language:4 };

function txt(r, f){
  var v = r[f];
  return String(v === null || v === undefined ? "" : v).toLowerCase();
}
function listHas(value, wanted){
  var k = key(wanted);
  return String(value || "").split(",").some(function(v){ return key(v) === k; });
}
function hasFacet(r, f){
  if (f.kind === "topic")    return listHas(r.topics, f.value);
  if (f.kind === "person")   return listHas(r.people, f.value);
  if (f.kind === "client")   return key(r.client) === key(f.value);
  if (f.kind === "docType")  return listHas(r.docType, f.value);
  if (f.kind === "industry") return key(r.industry) === key(f.value);
  if (f.kind === "library")  return r.library === f.value;
  if (f.kind === "language")   return listHas(r.language, f.value) || txt(r, "language").indexOf(key(f.value)) > -1;
  if (f.kind === "fileFormat") return key(r.fileFormat) === key(f.value);
  if (f.kind === "fileSize")   return key(r.fileSize) === key(f.value);
  if (f.kind === "year")       return String(r.year || "") === String(f.value);
  if (TAG_GROUP_MAP[f.kind])    return listHas(r.tags, f.value);
  return false;
}

function scoreAll(parsed, raw){
  var recs = S.records || [];
  var groups = {};
  parsed.facets.forEach(function(f){ (groups[f.kind] = groups[f.kind] || []).push(f); });
  var kinds = Object.keys(groups);
  if (!kinds.length && !parsed.free.length) return [];

  return recs.map(function(r){
    var s = 0, sat = 0;

    kinds.forEach(function(k){
      var n = groups[k].filter(function(f){ return hasFacet(r, f); }).length;
      if (n){ sat++; s += 30 + (n - 1) * 10; }
    });

    var covered = 0;
    parsed.free.forEach(function(t){
      var any = false;
      Object.keys(W).forEach(function(fl){
        if (txt(r, fl).indexOf(t) > -1){ s += W[fl]; any = true; }
      });
      if (any) covered++;
    });

    if (raw && txt(r, "title").indexOf(raw) > -1) s += 30;
    if (kinds.length && sat < kinds.length) return { r:r, s:0 };
    if (parsed.free.length && covered / parsed.free.length < 0.6) return { r:r, s:0 };

    s += Math.max(0, (Number(r.year) || 2024) - 2023) * 2;
    if (r.status === "Superseded" || r.status === "Archived") s -= 40;
    return { r:r, s:s };
  }).filter(function(x){ return x.s > 0; })
    .sort(function(a,b){ return b.s - a.s || (Number(b.r.year)||0) - (Number(a.r.year)||0); });
}

function current(list){
  return list.filter(function(x){ return x.r.status !== "Superseded" && x.r.status !== "Archived"; });
}

function runSearch(q, facetsIn){
  var parsed = facetsIn ? { facets:facetsIn.facets.slice(), free:facetsIn.free.slice() } : parseQuery(q);
  var raw = String(q || "").toLowerCase().trim();
  var recs = S.records || [];

  if (!parsed.facets.length && !parsed.free.length) return { hits:[], mode:"empty", parsed:parsed };

  var scored = scoreAll(parsed, raw);
  var liveHits = current(scored);
  if (liveHits.length) return { hits:liveHits, mode:"exact", parsed:parsed };
  if (scored.length) return { hits:scored, mode:"old", parsed:parsed };

  /* Keep tapped filters fixed if typed facets need to fall back to normal words. */
  if (raw && parsed.facets.some(function(f){ return f.source !== "tap"; })){
    var words = [];
    clean(q).split(" ").forEach(function(t){
      if (t && !STOP[t] && t.length > 1 && words.indexOf(t) < 0) words.push(t);
    });
    if (words.length){
      var fixed = parsed.facets.filter(function(f){ return f.source === "tap"; });
      var asWords = scoreAll({ facets:fixed, free:words }, raw);
      var liveWords = current(asWords);
      if (liveWords.length) return { hits:liveWords, mode:"words", parsed:{ facets:fixed, free:words } };
      if (asWords.length) return { hits:asWords, mode:"old", parsed:{ facets:fixed, free:words } };
    }
  }

  if (parsed.facets.length > 1){
    var loose = recs.map(function(r){
      var s = 0;
      parsed.facets.forEach(function(f){ if (hasFacet(r, f)) s += 20; });
      return { r:r, s:s };
    }).filter(function(x){ return x.s > 0 && x.r.status !== "Superseded"; })
      .sort(function(a,b){ return b.s - a.s; });
    if (loose.length) return { hits:loose, mode:"closest", parsed:parsed };
  }

  return { hits:[], mode:"none", parsed:parsed };
}

function safeLink(u){
  return /^https:\/\/(drive|docs)\.google\.com\//.test(String(u || ""));
}

function relatedTo(rec){
  var recs = S.records || [];
  var myTopics = String(rec.topics || "").split(",").map(function(s){ return s.trim(); }).filter(Boolean);
  var myPeople = String(rec.people || "").split(",").map(function(s){ return s.trim(); }).filter(Boolean);

  return recs.map(function(r){
    if (r.id === rec.id || r.status === "Superseded") return { r:r, s:0, why:[] };
    var s = 0, why = [];
    if (rec.client && r.client === rec.client){ s += 10; why.push("same client"); }
    var t = myTopics.filter(function(x){ return listHas(r.topics, x); });
    if (t.length){ s += 6 * t.length; why.push("topic: " + t.join(", ")); }
    var p = myPeople.filter(function(x){ return listHas(r.people, x); });
    if (p.length){ s += 4 * p.length; why.push("person: " + p.join(", ")); }
    if (rec.industry && r.industry === rec.industry && !rec.client){ s += 3; why.push("same industry"); }
    return { r:r, s:s, why:why };
  }).filter(function(x){ return x.s > 0; })
    .sort(function(a,b){ return b.s - a.s; })
    .slice(0, 6);
}

function quickValues(kind){
  if (kind === "client"){
    var fromRecords = (S.records || []).map(function(r){ return r.client; });
    return uniqueValues(S.clients.map(function(c){ return c.name; }).concat(fromRecords)).sort(function(a,b){ return a.localeCompare(b); });
  }
  if (kind === "docType") return FLAT_DOCTYPES.slice();
  if (kind === "fileFormat"){
    return uniqueValues((S.records || []).map(function(r){ return r.fileFormat || ""; }))
      .sort(function(a,b){ return a.localeCompare(b); });
  }
  if (kind === "fileSize"){
    var order = ["Google file","Under 1 MB","1-10 MB","10-50 MB","50-200 MB","Over 200 MB"];
    return uniqueValues((S.records || []).map(function(r){ return r.fileSize || ""; }))
      .sort(function(a,b){
        var ai = order.indexOf(a), bi = order.indexOf(b);
        return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi) || a.localeCompare(b);
      });
  }
  if (kind === "year"){
    return uniqueValues((S.records || []).map(function(r){ return r.year ? String(r.year) : ""; }))
      .sort(function(a,b){ return Number(b) - Number(a); });
  }
  return [];
}

function renderRetrieveFilters(){
  var root = $("retrieveFilters");
  if (!root) return;
  root.innerHTML = "";

  var quick = el("div", "filter-section");
  var qh = el("div", "filter-heading");
  qh.appendChild(el("strong", null, "Quick filters"));
  qh.appendChild(el("span", null, "optional"));
  quick.appendChild(qh);
  var qt = el("div", "quick-tabs");
  QUICK_FILTERS.forEach(function(group){
    var open = S.retrieve.activeQuick === group.key;
    var count = pickedValues(S.retrieve.filters, group.key).length;
    var b = el("button", "meta-tab"); b.type = "button";
    b.setAttribute("aria-expanded", String(open));
    b.appendChild(el("span", null, group.label));
    b.appendChild(el("b", null, String(count)));
    b.addEventListener("click", function(){
      S.retrieve.activeQuick = open ? "" : group.key;
      renderRetrieveFilters();
    });
    qt.appendChild(b);
  });
  quick.appendChild(qt);
  if (S.retrieve.activeQuick){
    var qp = el("div", "quick-panel");
    var qgrid = el("div", "choice-grid");
    quickValues(S.retrieve.activeQuick).forEach(function(v){
      var b = el("button", "choice", v); b.type = "button";
      b.setAttribute("aria-pressed", String(hasPicked(S.retrieve.filters, S.retrieve.activeQuick, v)));
      b.addEventListener("click", function(){
        togglePicked(S.retrieve.filters, S.retrieve.activeQuick, v);
        renderRetrieveFilters(); doSearch();
      });
      qgrid.appendChild(b);
    });
    if (!qgrid.children.length) qp.appendChild(el("p", "meta-note", "No options are available yet."));
    else qp.appendChild(qgrid);
    quick.appendChild(qp);
  }
  root.appendChild(quick);

  var tags = el("div", "filter-section");
  var th = el("div", "filter-heading");
  th.appendChild(el("strong", null, "Tags and keywords"));
  th.appendChild(el("span", null, "tap any that apply"));
  tags.appendChild(th);
  tags.appendChild(keywordBrowser("retrieve"));
  root.appendChild(tags);

  if (S.retrieve.filters.length){
    var reset = el("button", "filter-reset", "Clear all filters"); reset.type = "button";
    reset.addEventListener("click", function(){
      S.retrieve.filters = []; S.retrieve.activeQuick = ""; S.retrieve.activeTag = "";
      renderRetrieveFilters(); doSearch();
    });
    root.appendChild(reset);
  }
}

function loadRecords(){
  if (S.records || S.loadingRecords){ renderRetrieveFilters(); if (S.records) doSearch(); return; }
  if (!live()){ S.records = S.records || []; buildFacets(); renderRetrieveFilters(); doSearch(); return; }
  S.loadingRecords = true;
  $("results").innerHTML = '<div class="spin">Loading the index\u2026</div>';
  api("records").then(function(d){
    S.loadingRecords = false;
    S.records = (d && d.records) || [];
    buildFacets(); renderRetrieveFilters(); doSearch();
  }).catch(function(){
    S.loadingRecords = false;
    S.records = null;
    renderRetrieveFilters();
    $("results").innerHTML = '<div class="spin">Could not load the index. Check your connection and reopen this tab.</div>';
  });
}

function mergedSearch(q){
  var parsed = parseQuery(q);
  parsed.facets = parsed.facets.filter(function(f){
    return S.removed.indexOf(facetKey(f.kind, f.value)) < 0;
  });
  S.retrieve.filters.forEach(function(f){
    if (!hasPicked(parsed.facets, f.kind, f.value)) parsed.facets.push({ kind:f.kind, value:f.value, source:"tap" });
    else parsed.facets.forEach(function(x){ if (facetKey(x.kind,x.value) === facetKey(f.kind,f.value)) x.source = "tap"; });
  });
  return parsed;
}

function doSearch(){
  var q = $("q").value;
  if (q !== S.lastQuery) S.removed = [];
  S.lastQuery = q;
  var rb = $("readback"), out = $("results");
  rb.innerHTML = ""; out.innerHTML = "";

  if (!S.records) return;
  var parsed = mergedSearch(q);
  if (!S.records.length){
    out.appendChild(el("p", "banner", "No files yet. Choose Add a file to save the first one."));
    return;
  }
  var browsing = !String(q).trim() && !parsed.facets.length;
  var res = browsing ? {hits:S.records.slice().reverse().map(r => ({r:r}))} : runSearch(q, parsed);

  var bar = el("div", "readback");
  parsed.facets.slice().sort((a,b) => keywordOrder.compare(a.value,b.value)).forEach(function(f){
    var b = el("button", "fchip"); b.type = "button";
    b.appendChild(document.createTextNode(f.value));
    b.appendChild(el("em", null, "\u00D7"));
    b.title = "Remove this filter";
    b.addEventListener("click", function(){
      if (hasPicked(S.retrieve.filters, f.kind, f.value)){
        togglePicked(S.retrieve.filters, f.kind, f.value);
        renderRetrieveFilters();
      } else {
        S.removed.push(facetKey(f.kind, f.value));
      }
      doSearch();
    });
    bar.appendChild(b);
  });
  parsed.free.forEach(function(t){ bar.appendChild(el("span", "fchip free", '"' + t + '"')); });
  if (browsing || parsed.facets.length || parsed.free.length){
    bar.appendChild(el("span", "count", res.hits.length + (res.hits.length === 1 ? " result" : " results")));
    rb.appendChild(bar);
  }
  if (S.removed.length){
    var resetTyped = el("button", "fchip free", "restore typed filters");
    resetTyped.type = "button";
    resetTyped.addEventListener("click", function(){ S.removed = []; doSearch(); });
    bar.appendChild(resetTyped);
  }

  if (res.mode === "old") rb.appendChild(el("div", "banner", "Only older versions match. A newer one may exist under a different name."));
  if (res.mode === "words") rb.appendChild(el("div", "banner", "No file is tagged that way, so these match your words instead."));
  if (res.mode === "closest") rb.appendChild(el("div", "banner", "No exact match. Showing the closest files."));

  if (!res.hits.length){
    var none = el("div", "banner");
    none.textContent = "Nothing found. Remove a filter or try fewer words.";
    var clear = el("button", "go ghost", S.retrieve.filters.length ? "Clear filters" : "Clear search");
    clear.addEventListener("click", function(){
      if (S.retrieve.filters.length) S.retrieve.filters = [];
      else $("q").value = "";
      S.removed = [];
      renderRetrieveFilters(); doSearch(); $("q").focus();
    });
    none.appendChild(clear); out.appendChild(none);
    return;
  }

  var list = el("div", "results");
  out.appendChild(list);
  var shown = 0, more = el("button", "go ghost", "Show more files");
  function nextPage(){
    res.hits.slice(shown, shown + 40).forEach(hit => list.appendChild(resultCard(hit.r)));
    shown += 40; more.hidden = shown >= res.hits.length;
  }
  more.addEventListener("click", nextPage); out.appendChild(more); nextPage();
}

function resultCard(r){
  var c = el("div", "res");

  var h = el("h3");
  h.appendChild(document.createTextNode(r.title || "(untitled)"));
  if (r.status === "Superseded" || r.status === "Archived") h.appendChild(el("span", "old", r.status));
  c.appendChild(h);

  var bits = [r.fileFormat, r.docType];
  c.appendChild(el("div", "meta", bits.filter(Boolean).join("  \u00B7  ")));

  c.appendChild(el("p", "folder-path", [r.library, r.folderPath].filter(Boolean).join(" > ").split(" > ").join(" › ")));
  if (r.description) c.appendChild(el("p", "desc", r.description));


  var acts = el("div", "acts");
  if (safeLink(r.driveLink)){
    var a = el("a", "open-file", "Open file");
    a.href = r.driveLink; a.target = "_blank"; a.rel = "noopener";
    acts.appendChild(a);
  }
  if (!safeLink(r.driveLink)) acts.appendChild(el("span", "note", "File link unavailable"));
  var menu=el("details","result-menu"); menu.appendChild(el("summary",null,"More"));
  var folder = S.folders[r.library + " > " + r.folderPath];
  if (safeLink(folder)){
    var openFolder = el("a", null, "Open folder");
    openFolder.href = folder; openFolder.target = "_blank"; openFolder.rel = "noopener";
    menu.appendChild(openFolder);
  }
  var relBox = el("div", "rel");
  relBox.hidden = true;
  var relButton = el("button", null, "Related \u25B8");
  relButton.type = "button";
  relButton.addEventListener("click", function(){
    if (!relBox.hidden){ relBox.hidden = true; relButton.textContent = "Related \u25B8"; return; }
    relBox.innerHTML = "";
    var rel = relatedTo(r);
    if (!rel.length){
      relBox.appendChild(el("div", "why", "Nothing else shares its client, topic or people."));
    } else {
      rel.forEach(function(x){
        var row = el("div", "r");
        if (safeLink(x.r.driveLink)){
          var link = el("a", null, x.r.title);
          link.href = x.r.driveLink; link.target = "_blank"; link.rel = "noopener";
          row.appendChild(link);
        } else row.appendChild(document.createTextNode(x.r.title));
        row.appendChild(el("div", "why", x.why.join("  \u00B7  ")));
        relBox.appendChild(row);
      });
    }
    relBox.hidden = false;
    relButton.textContent = "Related \u25BE";
  });
  menu.appendChild(relButton); acts.appendChild(menu);
  c.appendChild(acts);
  c.appendChild(relBox);
  return c;
}

var tmr = null;
$("q").addEventListener("input", function(){
  clearTimeout(tmr);
  tmr = setTimeout(doSearch, 140);
});
Array.prototype.forEach.call(document.querySelectorAll("[data-eg]"), function(b){
  b.addEventListener("click", function(){
    $("q").value = b.getAttribute("data-eg");
    S.removed = [];
    doSearch();
  });
});

/* ============================================================
   BOOT
   ============================================================ */

function renderAdmin(initialGroup, notice){
  const panel = $("p-admin");
  panel.innerHTML = "";
  panel.appendChild(el("h2", null, "Manage keywords"));
  const group = el("select");
  displayTagGroups.forEach(g => group.appendChild(new Option(g.label, g.key)));
  group.value = initialGroup || "topic";
  panel.appendChild(field("adminGroup", "Keyword group", group));
  const current = el("select");
  current.appendChild(new Option("Add a new keyword", ""));
  TAG_GROUP_MAP[group.value].values.forEach(v => current.appendChild(new Option(v, v)));
  panel.appendChild(field("adminCurrent", "Keyword", current));
  const editor = el("div"); panel.appendChild(editor);
  const message = el("p", "note", notice || "");
  message.setAttribute("role", "status"); panel.appendChild(message);
  let version = 0;
  group.addEventListener("change", () => renderAdmin(group.value));
  current.addEventListener("change", () => edit(""));
  async function edit(noticeText){
    const original = current.value, request = ++version;
    editor.innerHTML = ""; message.className = "note"; message.textContent = noticeText;
    editor.setAttribute("aria-busy", original ? "true" : "false");
    let count = 0;
    if (original){
      message.className = "keyword-loading";
      message.textContent = "Checking keyword…";
      try {
        const usage = await api("keywordUsage", {group:group.value, original:original});
        if (version !== request) return;
        count = usage.count;
        message.textContent = "Used on " + count + (count === 1 ? " record." : " records.");
      } catch (err){ if (version === request) message.textContent = err.message; return; }
      finally {
        if (version === request) {
          message.className = "note";
          editor.setAttribute("aria-busy", "false");
        }
      }
    }
    const name = input("text", "Keyword name"); name.value = original; name.maxLength = 80;
    editor.appendChild(field("keywordName", original ? "Edit name" : "New keyword", name));
    const save = el("button", "go", original ? "Save name" : "Add keyword");
    editor.appendChild(save);
    save.addEventListener("click", () => submit(original ? "rename" : "add", name.value));
    if (original){
      const remove = el("button", "go ghost", "Remove keyword…"); editor.appendChild(remove);
      remove.addEventListener("click", function(){
        editor.innerHTML = "";
        editor.appendChild(el("p", null, "Remove “" + original + "” from the list and " + count + (count === 1 ? " record?" : " records?")));
        const replace = el("select");
        replace.appendChild(new Option("Remove without replacement", ""));
        TAG_GROUP_MAP[group.value].values.filter(v => v !== original).forEach(v => replace.appendChild(new Option(v,v)));
        editor.appendChild(field("replacement", "Replacement keyword", replace));
        const confirm = el("button", "go", "Confirm removal");
        confirm.addEventListener("click", () => submit("remove", replace.value));
        const cancel = el("button", "go ghost", "Cancel"); cancel.addEventListener("click", () => edit(""));
        editor.appendChild(confirm); editor.appendChild(cancel);
      });
    }
    async function submit(operation, value){
      const controls = panel.querySelectorAll("button,select,input");
      controls.forEach(c => c.disabled = true);
      message.textContent = "Saving…";
      try {
        const saved = await api("editKeyword", {operation, group:group.value, original, value, count});
        applyKeywords(saved.keywords); S.records = null;
        renderAdmin(group.value, operation === "remove" ? "Keyword removed." : "Keyword saved.");
      } catch (err){ message.textContent = err.message; }
      finally { controls.forEach(c => c.disabled = false); }
    }
  }
  edit(notice || "");
}

function applyKeywords(catalog){
  TAG_GROUPS.forEach(g => { g.values = (catalog[g.key] || []).slice().sort(keywordOrder.compare); });
  S.topics = TAG_GROUP_MAP.topic.values;
  const valid = x => !TAG_GROUP_MAP[x.kind] || TAG_GROUP_MAP[x.kind].values.includes(x.value);
  S.retrieve.filters = S.retrieve.filters.filter(valid);
  if (S.record) {
    S.record.selected = S.record.selected.filter(valid);
    const draft=currentDraft();
    if (draft) renderRecord(draft);
  }
  buildFacets();
}

function boot(){
  const form = $("accessForm"), status = $("accessStatus");
  if (!live()) status.textContent = "The repository owner needs to connect the Google deployment.";
  form.addEventListener("submit", async function(ev){
    ev.preventDefault();
    const button = form.querySelector("button");
    if (button.disabled) return;
    button.disabled = true; accessKey = $("accessKey").value.trim();
    status.textContent = "Opening repository…";
    try {
      const d = await api("init");
      if (!d.keywords) throw new Error("Connect the updated Apps Script deployment.");
      S.admin = d.admin; S.clients = d.clients; S.people = d.people; S.folders = d.folders; S.next = d.next;
      applyKeywords(d.keywords);
      $("adminMenu").hidden = !d.admin;

      $("accessKey").value = ""; form.hidden = true; $("workspace").hidden = false;
      renderPicker(); renderRetrieveFilters();
    } catch (err) { accessKey = ""; status.textContent = err.message; }
    finally { button.disabled = false; }
  });
}
boot();

window.__AKR = { S:S, safeLink:safeLink, parseQuery:parseQuery, runSearch:runSearch, relatedTo:relatedTo,
                 buildFacets:buildFacets, plan:plan, nearMatch:nearMatch, showTab:showTab,
                 doSearch:doSearch, renderRecord:renderRecord, renderPicker:renderPicker,
                 renderRetrieveFilters:renderRetrieveFilters, hasFacet:hasFacet, togglePicked:togglePicked,
                 pickedValues:pickedValues, recordTagValues:recordTagValues, titleYear:titleYear,
                 folderNames:folderNames, clientFolderNames:clientFolderNames,
                 folderChildren:folderChildren, pathParts:pathParts, joinPath:joinPath,
                 destinationExtra:destinationExtra, newFolderForm:newFolderForm,
                 folderTarget:folderTarget, folderUrl:folderUrl, TAG_GROUPS:TAG_GROUPS, FLAT_DOCTYPES:FLAT_DOCTYPES };
})();
</script>
