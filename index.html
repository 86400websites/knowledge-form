<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#FFFFFF; --ground:#ECF0F2; --surface:#F7F9FA;
  --ink:#12161A; --ink-soft:#5A6672; --ink-faint:#8A949E;
  --rule:#DFE5E8; --rule-soft:#EBEFF1;
  --accent:#006E8A; --accent-deep:#005267; --accent-2:#00A883; --accent-3:#ABD328;
  --warn:#9A3412; --warn-bg:#FDF3EF;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);
  background-image:radial-gradient(circle at 1px 1px, rgba(18,22,26,.045) 1px, transparent 0);
  background-size:22px 22px;
  color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.page{max-width:620px;margin:0 auto;padding:40px 20px 72px}
@media (max-width:600px){ .page{padding:16px 12px 56px} }

.card{background:var(--paper);border:1px solid var(--rule);border-radius:8px;overflow:hidden;
  box-shadow:0 1px 2px rgba(18,22,26,.04), 0 18px 40px -28px rgba(18,22,26,.28)}
.tri{display:flex;height:3px}
.tri i{flex:1}
.tri i:nth-child(1){background:var(--accent)}
.tri i:nth-child(2){background:var(--accent-2)}
.tri i:nth-child(3){background:var(--accent-3)}

.masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:20px 26px 16px}
@media (max-width:600px){ .masthead{padding:16px 16px 12px} }
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{display:block;height:26px;width:auto}
.wordmark{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink);line-height:1.45}
.chip{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-faint);background:var(--surface);border:1px solid var(--rule-soft);
  border-radius:4px;padding:5px 8px;white-space:nowrap;flex:none;text-align:right;line-height:1.2}
.chip b{display:block;color:var(--accent);font-weight:600;font-size:11.5px;letter-spacing:.03em;margin-top:1px}
.chip[hidden]{display:none}

/* ---------- tabs ---------- */
.tabs{display:flex;border-bottom:1px solid var(--rule);padding:0 26px;gap:2px}
@media (max-width:600px){ .tabs{padding:0 8px} }
.tab{flex:1;background:none;border:0;cursor:pointer;padding:0 4px 12px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);position:relative;min-height:44px;transition:color .15s ease}
.tab:hover{color:var(--ink-soft)}
.tab .num{display:block;font-size:9px;opacity:.6;margin-bottom:2px}
.tab[aria-selected=true]{color:var(--accent);font-weight:600}
.tab[aria-selected=true]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;
  height:2px;background:var(--accent);border-radius:2px 2px 0 0}
.tab:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}

.panel{padding:26px}
@media (max-width:600px){ .panel{padding:20px 16px} }
.panel[hidden]{display:none}

h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
.sub{font-size:13.5px;color:var(--ink-soft);margin:0 0 20px}

/* ---------- pick lists (tab 1) ---------- */
.backbar{display:flex;align-items:center;gap:12px;margin:16px 0 18px}
.backbar[hidden]{display:none}
.back{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;
  background:var(--surface);border:1px solid var(--rule);border-radius:5px;cursor:pointer;
  font-family:var(--sans);font-size:14px;color:var(--ink);
  transition:border-color .15s ease,background .15s ease}
.back:hover{border-color:var(--accent);background:var(--paper)}
.back:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,110,138,.13)}
.here{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-faint);min-width:0;word-break:break-word;line-height:1.5}

.pick{display:block;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--rule);border-radius:5px;padding:13px 14px;margin-bottom:7px;
  cursor:pointer;font-family:var(--sans);font-size:15px;color:var(--ink);
  transition:border-color .15s ease,background .15s ease}
.pick:hover{border-color:var(--accent);background:var(--paper)}
.pick:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,110,138,.13)}
.pick b{display:block;font-weight:500}
.pick i{display:block;font-style:normal;font-family:var(--mono);font-size:10px;
  color:var(--ink-faint);margin-top:3px;letter-spacing:.03em}
.pick.add{background:var(--paper);border-style:dashed;color:var(--accent)}
.pick.add:hover{background:var(--surface)}

/* ---------- destination ---------- */
.dest{border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-top:4px}
.dest-top{background:var(--surface);padding:16px;border-bottom:1px solid var(--rule)}
.dest-path{font-family:var(--mono);font-size:13px;color:var(--ink);font-weight:600;word-break:break-word}
.dest-body{padding:16px}
.rename{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin:0 0 4px}
.rename b{display:block;color:var(--ink);margin-top:5px;font-weight:400;word-break:break-word}

/* ---------- fields ---------- */
.f{margin-bottom:18px}
.f:last-child{margin-bottom:0}
label,.lab{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px;font-weight:500}
input[type=text],input[type=url],input[type=search],select,textarea{
  width:100%;font-family:var(--sans);font-size:16px;color:var(--ink);
  background:var(--surface);border:1px solid var(--rule);border-radius:5px;
  padding:12px 13px;line-height:1.4;appearance:none;-webkit-appearance:none;
  transition:border-color .15s ease,box-shadow .15s ease,background .15s ease}
input::placeholder,textarea::placeholder{color:var(--ink-faint)}
textarea{resize:vertical;min-height:84px}
select{cursor:pointer;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='11' height='7'%3E%3Cpath d='M1 1.5l4.5 4 4.5-4' fill='none' stroke='%235A6672' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:36px}
input:hover,select:hover,textarea:hover{border-color:#CBD4D9}
input:focus,select:focus,textarea:focus{outline:none;background:var(--paper);
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,110,138,.13)}
.help{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:7px;line-height:1.55}
.err{font-family:var(--mono);font-size:10.5px;color:var(--warn);margin-top:7px;line-height:1.55;
  display:none;background:var(--warn-bg);border-left:2px solid var(--warn);padding:6px 9px;
  border-radius:0 3px 3px 0}
.f.bad .err{display:block}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--warn);background:var(--paper)}
.f.bad .help{display:none}
.f.bad .ticks{border-color:var(--warn)}

.ticks{border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.tick{display:flex;align-items:center;gap:11px;padding:11px 13px;cursor:pointer;
  background:var(--surface);min-height:44px;margin:0;font-family:var(--sans);font-size:15px;
  letter-spacing:0;text-transform:none;color:var(--ink)}
.tick + .tick{border-top:1px solid var(--rule)}
.tick input{width:16px;height:16px;accent-color:var(--accent);flex:none;margin:0}
.locked{font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--rule);
  border-radius:5px;padding:12px 13px;color:var(--ink-soft)}

.seg{display:flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.seg label{flex:1;margin:0;padding:0;cursor:pointer;font-family:var(--sans);font-size:13px;
  text-transform:none;letter-spacing:0;color:var(--ink)}
.seg label + label{border-left:1px solid var(--rule)}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:flex;align-items:center;justify-content:center;min-height:44px;
  background:var(--surface);padding:0 6px}
.seg input:checked + span{background:var(--accent);color:#fff}
.seg input:focus-visible + span{box-shadow:inset 0 0 0 2px var(--ink)}

/* ---------- buttons ---------- */
.go{width:100%;min-height:50px;background:var(--accent);color:#fff;border:0;border-radius:5px;
  font-family:var(--sans);font-size:15.5px;font-weight:500;cursor:pointer;
  transition:background .15s ease,transform .08s ease;display:flex;align-items:center;
  justify-content:center;gap:8px;text-decoration:none}
.go:hover{background:var(--accent-deep)}
.go:active{transform:translateY(1px)}
.go:disabled{opacity:.5;cursor:default;transform:none}
.go:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.go.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--rule)}
.go.ghost:hover{background:var(--surface);border-color:var(--accent)}
.stackbtn{display:grid;gap:9px;margin-top:16px}
.formerr{font-family:var(--mono);font-size:10.5px;color:var(--warn);margin-top:13px;
  line-height:1.6;display:none;text-align:center}
.formerr.on{display:block}
.note{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);line-height:1.6;margin:14px 0 0}
.warnbox{font-family:var(--mono);font-size:11px;color:var(--warn);background:var(--warn-bg);
  border-left:2px solid var(--warn);padding:10px 12px;border-radius:0 3px 3px 0;margin:0 0 14px;line-height:1.6}

/* ---------- record: chosen folder strip ---------- */
.strip{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--surface);border:1px solid var(--rule);border-radius:5px;
  padding:11px 13px;margin-bottom:22px}
.strip .p{font-family:var(--mono);font-size:11px;color:var(--ink);word-break:break-word;line-height:1.5}
.strip button{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);flex:none;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.strip button:hover{text-decoration:underline}

.empty{text-align:center;padding:26px 0}
.empty p{font-size:14px;color:var(--ink-soft);margin:0 0 18px}

/* ---------- record stub ---------- */
.stub-kicker{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-2);font-weight:600}
.stub-id{font-family:var(--mono);font-size:32px;letter-spacing:.01em;color:var(--ink);
  margin:8px 0 22px;font-weight:600}
.perf{border-top:1px dashed var(--rule);margin-bottom:4px}
.row{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--rule-soft);font-size:14px}
.row:last-of-type{border-bottom:0}
.row dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-faint);width:78px;flex:none;padding-top:4px}
.row dd{margin:0;min-width:0;word-break:break-word}

/* ---------- retrieve ---------- */
.searchwrap{position:relative}
.eg{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin:9px 0 0;line-height:1.7}
.eg button{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);
  font-family:var(--mono);font-size:10px}
.eg button:hover{text-decoration:underline}
.readback{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:16px 0 0}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;
  border:0;border-radius:4px;padding:5px 8px;font-family:var(--mono);font-size:10px;
  letter-spacing:.04em;cursor:pointer}
.fchip:hover{background:var(--accent-deep)}
.fchip em{font-style:normal;opacity:.7;font-size:11px}
.fchip.free{background:var(--surface);color:var(--ink-soft);border:1px solid var(--rule)}
.count{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-left:auto;
  letter-spacing:.06em;text-transform:uppercase}
.banner{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);background:var(--surface);
  border:1px solid var(--rule);border-radius:5px;padding:9px 11px;margin:16px 0 0;line-height:1.6}

.results{margin-top:6px}
.res{border-bottom:1px solid var(--rule-soft);padding:18px 0}
.res:last-child{border-bottom:0}
.res h3{font-size:15px;font-weight:500;margin:0 0 5px;line-height:1.4;word-break:break-word}
.res .meta{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.04em;
  margin-bottom:7px;line-height:1.6;word-break:break-word}
.res .desc{font-size:13.5px;color:var(--ink-soft);margin:0 0 11px;line-height:1.55}
.res .acts{display:flex;gap:16px;flex-wrap:wrap}
.res .acts a,.res .acts button{font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent);background:none;border:0;padding:0 0 2px;
  cursor:pointer;text-decoration:none;border-bottom:1px solid var(--rule)}
.res .acts a:hover,.res .acts button:hover{border-bottom-color:var(--accent)}
.old{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--warn);background:var(--warn-bg);border-radius:3px;
  padding:2px 6px;margin-left:6px;vertical-align:middle}
.rel{margin-top:12px;padding:12px 14px;background:var(--surface);border-radius:5px;
  border-left:2px solid var(--accent-2)}
.rel[hidden]{display:none}
.rel .r{padding:7px 0;border-bottom:1px solid var(--rule-soft);font-size:13.5px}
.rel .r:last-child{border-bottom:0}
.rel .r a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
.rel .r a:hover{border-bottom-color:var(--accent)}
.rel .why{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);margin-top:3px;letter-spacing:.03em}

.spin{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);text-align:center;padding:26px 0;
  letter-spacing:.08em;text-transform:uppercase}

.foot{text-align:center;margin-top:18px;font-family:var(--mono);font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>

<body>
<div class="page">
<div class="card">
  <div class="tri"><i></i><i></i><i></i></div>

<script>
(function(){
"use strict";

/* ============================================================
   VOCABULARY
   ============================================================ */

var TOPICS = ["Artificial Intelligence","Leadership","Future of Work","Learning & Skills","Innovation"];

var CLIENT_SUBS = ["01 Commercial","02 Delivery","03 Relationship"];

var LIBS = [
  { id:"01 Clients",       desc:"files for one specific client",  kind:"client" },
  { id:"02 Content",       desc:"material we teach and deliver",  kind:"list", folders:TOPICS },
  { id:"03 Market & Sell", desc:"anything we use to win work",    kind:"list",
    folders:["Proposal Library","Capability Decks","Case Studies","Pricing & Commercial Templates","Brand Assets"] },
  { id:"04 People",        desc:"facilitators and team members",  kind:"person" },
  { id:"05 Research",      desc:"ours and other people's",        kind:"list",
    folders:["Alliance Thought Leadership","External Research"] },
  { id:"06 Alliance IP",   desc:"how Alliance itself works",      kind:"list",
    folders:["Frameworks & Models","Methodologies","Templates & Playbooks","Prompt Library"] },
  { id:"99 Archive",       desc:"replaced files",                 kind:"single", folders:["Archive"] }
];

var DOCTYPES = [
  ["Commercial",        ["Proposal","Contract / SOW","Pricing Document"]],
  ["Delivery material", ["Slide Deck","Workbook","Facilitator Guide","Activity","Assessment","Case Study"]],
  ["Written",           ["Report","Article","Meeting Notes"]],
  ["Media",             ["Video","Image / Brand Asset"]],
  ["Reusable",          ["Template","Framework","Prompt"]],
  ["People",            ["CV / Biography","Feedback"]],
  ["Anything else",     ["Other"]]
];
var FLAT_DOCTYPES = [];
DOCTYPES.forEach(function(g){ g[1].forEach(function(d){ FLAT_DOCTYPES.push(d); }); });

var INDUSTRIES = ["Government","Healthcare","Banking & Finance","Education","Energy",
                  "Technology","Manufacturing","Retail","Logistics","Other"];
var LANGUAGES = ["English","Arabic"];

/* ============================================================
   STATE
   ============================================================ */

var S = {
  clients: [],        // {name, industry, url}
  people:  [],        // {name, language, url}
  folders: {},        // "path" -> url
  next:    "",
  dest:    null,      // {library, folderPath, client, person, topicHint, url}
  nav:     { lib:null, client:null },
  records: null,      // lazy
  loadingRecords: false,
  lastQuery: "",
  removed: []         // facets the user dismissed
};

function $(id){ return document.getElementById(id); }
function el(tag, cls, txt){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; });
}
function live(){ return /^https:\/\//.test(CONFIG.ENDPOINT); }

function api(action, payload){
  if (!live()) return Promise.reject(new Error("not configured"));
  if (payload){
    return fetch(CONFIG.ENDPOINT, {
      method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(Object.assign({ action: action }, payload))
    }).then(function(r){ return r.json(); });
  }
  return fetch(CONFIG.ENDPOINT + "?action=" + encodeURIComponent(action))
    .then(function(r){ return r.json(); });
}

/* ============================================================
   TABS
   ============================================================ */

var TABS = ["upload","record","retrieve"];

function showTab(name){
  TABS.forEach(function(t){
    var on = (t === name);
    $("tab-" + t).setAttribute("aria-selected", String(on));
    $("p-" + t).hidden = !on;
  });
  if (name === "record" && !$("recForm")) renderRecord();
  if (name === "retrieve") { loadRecords(); setTimeout(function(){ $("q").focus(); }, 30); }
  window.scrollTo({ top:0, behavior:"smooth" });
}
TABS.forEach(function(t){
  $("tab-" + t).addEventListener("click", function(){ showTab(t); });
});

/* ============================================================
   TAB 1 — UPLOAD
   ============================================================ */

/* One button that always goes up exactly one level. No link trails. */
function goBack(){
  if (S.dest){ S.dest = null; renderPicker(); return; }
  if (S.nav.client){ S.nav.client = null; renderPicker(); return; }
  S.nav = { lib:null, client:null };
  renderPicker();
}

function backbar(){
  var b = $("backbar");
  b.innerHTML = "";
  if (!S.nav.lib){ b.hidden = true; return; }
  b.hidden = false;
  var btn = el("button", "back");
  btn.type = "button";
  btn.appendChild(el("span", null, "\u2190"));
  btn.appendChild(el("span", null, "Back"));
  btn.addEventListener("click", goBack);
  b.appendChild(btn);
  var where = S.nav.lib.id + (S.nav.client ? " \u203A " + S.nav.client : "");
  b.appendChild(el("div", "here", where));
}

function pickButton(main, note, fn, cls){
  var b = el("button", "pick" + (cls ? " " + cls : ""));
  b.type = "button";
  b.appendChild(el("b", null, main));
  if (note) b.appendChild(el("i", null, note));
  b.addEventListener("click", fn);
  return b;
}

function renderPicker(){
  backbar();
  var box = $("picker");
  box.innerHTML = "";

  /* level 0 — the seven libraries, real names */
  if (!S.nav.lib){
    LIBS.forEach(function(L){
      box.appendChild(pickButton(L.id, L.desc, function(){
        S.nav.lib = L; S.nav.client = null;
        if (L.kind === "single") return choose(L.id, L.folders[0]);
        renderPicker();
      }));
    });
    return;
  }

  var L = S.nav.lib;

  /* 01 Clients — client list, then subfolder */
  if (L.kind === "client"){
    if (!S.nav.client){
      if (!S.clients.length){
        box.appendChild(el("p", "sub", "No clients yet. Add the first one below."));
      }
      S.clients.forEach(function(c){
        box.appendChild(pickButton(c.name, c.industry, function(){
          S.nav.client = c.name; renderPicker();
        }));
      });
      box.appendChild(pickButton("+ Add a new client", null, function(){ newNameForm("client"); }, "add"));
      return;
    }
    CLIENT_SUBS.forEach(function(sub){
      box.appendChild(pickButton(sub, null, function(){
        choose(L.id, S.nav.client + " > " + sub, { client:S.nav.client });
      }));
    });
    return;

/* ---- create a client or a person, without leaving the page ---- */

function norm(s){ return String(s || "").trim().replace(/\s+/g, " "); }
function key(s){ return norm(s).toLowerCase(); }

function lev(a, b){
  a = key(a); b = key(b);
  var m = a.length, n = b.length, i, j, prev = [], cur = [];
  if (!m) return n;
  if (!n) return m;
  for (j = 0; j <= n; j++) prev[j] = j;
  for (i = 1; i <= m; i++){
    cur[0] = i;
    for (j = 1; j <= n; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    prev = cur.slice();
  }
  return prev[n];
}

/* An exact duplicate is blocked outright. A near-duplicate needs a second,
   explicit click — because two spellings of one client silently split the
   index in half and nobody notices for months. */
function nearMatch(name, list){
  var k = key(name);
  for (var i = 0; i < list.length; i++){
    var other = list[i].name, ok2 = key(other);
    if (ok2 === k) return { exact:true, name:other };
    if (ok2.indexOf(k) === 0 || k.indexOf(ok2) === 0) return { exact:false, name:other };
    if (lev(k, ok2) <= 2) return { exact:false, name:other };
  }
  return null;
}

function folderUrl(library, folderPath){
  var L = CONFIG.FOLDER_LINKS || {};
  /* Clients and people land on the library folder so they can walk into the
     one they just created, rather than a link that did not exist a minute ago. */
  if (library === "01 Clients" || library === "04 People"){
    return L[library] || S.folders[library] || "";
  }
  return L[library + " > " + folderPath] || S.folders[library + " > " + folderPath] ||
         L[library] || S.folders[library] || "";
}

function choose(library, folderPath, extra){

function field(id, label, control, help){
  var f = el("div", "f");
  f.id = "f-" + id;

  if (control.tagName === "INPUT" || control.tagName === "SELECT" || control.tagName === "TEXTAREA"){
    if (!control.id) control.id = id;
    l.setAttribute("for", control.id);
  } else {
    l.className = "lab";
  }
  f.appendChild(l);
  f.appendChild(control);
  if (help) f.appendChild(el("div", "help", help));
  f.appendChild(el("div", "err"));
  return f;
}
function input(type, ph){
  var i = document.createElement("input");
  i.type = type; i.autocomplete = "off";
  if (ph) i.placeholder = ph;
  return i;
}
function textarea(){
  var t = document.createElement("textarea");
  t.rows = 3;
  return t;
}
function locked(v){ return el("div", "locked", v); }
function docSelect(){
  var s = document.createElement("select");
  s.appendChild(new Option("Choose", ""));
  DOCTYPES.forEach(function(g){
    var og = document.createElement("optgroup");
    og.label = g[0];
    g[1].forEach(function(v){ og.appendChild(new Option(v, v)); });
    s.appendChild(og);
  });
  return s;
}
function tickList(name, values, checked){
  var box = el("div", "ticks");
  box.setAttribute("data-group", name);
  values.forEach(function(v, i){
    var l = el("label", "tick");
    l.setAttribute("for", name + "-" + i);
    var c = document.createElement("input");
    c.type = "checkbox"; c.value = v; c.id = name + "-" + i;
    c.className = name + "-box";
    if (checked.indexOf(v) > -1) c.checked = true;
    l.appendChild(c);
    l.appendChild(el("span", null, v));
    box.appendChild(l);
  });
  return box;
}
function segment(name, values, def){
  var s = el("div", "seg");
  values.forEach(function(v, i){
    var l = document.createElement("label");
    l.setAttribute("for", name + "-" + i);
    var r = document.createElement("input");
    r.type = "radio"; r.name = name; r.value = v; r.id = name + "-" + i;
    r.className = name + "-radio";
    if (v === def) r.checked = true;
    l.appendChild(r);
    l.appendChild(el("span", null, v));
    s.appendChild(l);
  });
  return s;
}
function ticked(name){
  return Array.prototype.slice.call(document.querySelectorAll("." + name + "-box:checked"))
    .map(function(c){ return c.value; });
}

function bad(id, msg){
  var f = $("f-" + id);
  if (!f) return;
  f.classList.add("bad");
  f.querySelector(".err").textContent = msg;
}
function clr(id){
  var f = $("f-" + id);
  if (!f) return;
  f.classList.remove("bad");
  f.querySelector(".err").textContent = "";
}

var sending = false;

function submitRecord(ev){
  ev.preventDefault();
  if (sending) return;
  var fe = $("formerr");
  fe.classList.remove("on");

  var n = 0;
  if (!$("title").value.trim()){ bad("title", "Enter the title. It must match the file name in Drive."); n++; } else clr("title");
  if ($("desc").value.trim().length < 20){ bad("desc", "One or two sentences \u2014 at least 20 characters. This is what finds the file again."); n++; } else clr("desc");

  var link = $("link").value.trim();
  if (!link){ bad("link", "Paste the Drive link \u2014 right-click the file \u203A Share \u203A Copy link."); n++; }
  else if (!/^https:\/\/(drive|docs)\.google\.com\//.test(link)){ bad("link", "That is not a Google Drive link. Right-click the file in Drive, choose Share, then Copy link."); n++; }
  else clr("link");

  if (!$("doc").value){ bad("doc", "Choose what kind of file this is."); n++; } else clr("doc");

  var P = plan(S.dest);
  var topics = [];
  if (P.topics === "multi"){
    topics = ticked("topic");
    if (!topics.length){ bad("topics", "Tick at least one area of expertise."); n++; } else clr("topics");
  } else if (P.topics !== "no"){
    var tv = $("topic") ? $("topic").value : "";
    if (!tv){ bad("topics", "Choose the topic this file is about."); n++; } else { topics = [tv]; clr("topics"); }
  }
  var clientVal = P.client === "locked" ? S.dest.client
                : P.client === "ask" ? ($("client") ? $("client").value : "") : "";
  if (P.client === "ask"){
    if (!clientVal || clientVal === "__new"){ bad("client", "Choose the client this is for."); n++; } else clr("client");
  }

  if (n){
    fe.textContent = (n === 1 ? "One field needs attention." : n + " fields need attention.") + " Marked above.";
    fe.classList.add("on");
    var first = document.querySelector(".f.bad");
    if (first){
      first.scrollIntoView({ block:"center", behavior:"smooth" });
      var fc = first.querySelector("input,select,textarea");
      if (fc) fc.focus({ preventScroll:true });
    }
    return;
  }

  if ($("website").value) return;

  var people = P.people === "locked" ? [S.dest.person] : (P.people === "ask" ? ticked("person") : []);
  var langEl = document.querySelector(".lang-radio:checked");

  var payload = {
    title:       $("title").value.trim(),
    description: $("desc").value.trim(),
    driveLink:   link,
    docType:     $("doc").value,
    topics:      topics.join(", "),
    client:      clientVal,
    people:      people.join(", "),
    industry:    clientVal ? industryOf(clientVal) : ($("industry") ? $("industry").value : ""),
    language:    langEl ? langEl.value : "English",
    library:     S.dest.library,
    folderPath:  S.dest.folderPath,
    website:     ""
  };

  sending = true;
  var go = $("go");
  go.disabled = true;
  go.textContent = "Recording\u2026";

  api("record", payload)
    .then(function(d){
      if (!d || !d.ok) throw new Error(d && d.error ? d.error : "failed");
      S.records = null;                       // index changed
      if (d.next) { S.next = d.next; $("chipId").textContent = d.next; $("chip").hidden = false; }
      recordDone(d.id, payload);
    })
    .catch(function(){
      sending = false;
      go.disabled = false;
      go.textContent = "Record file";
      fe.textContent = "Could not reach the Sheet. Press Record file again \u2014 nothing was lost.";
      fe.classList.add("on");
    });
}

var FACETS = [];
function addFacet(phrase, kind, value){
  if (!phrase) return;
  FACETS.push({ p: String(phrase).toLowerCase(), kind: kind, value: value });
}

function buildFacets(){
  FACETS = [];
  TOPICS.forEach(function(t){ addFacet(t, "topic", t); });
  addFacet("ai", "topic", "Artificial Intelligence");
  addFacet("genai", "topic", "Artificial Intelligence");
  addFacet("machine learning", "topic", "Artificial Intelligence");
  addFacet("fow", "topic", "Future of Work");
  addFacet("l&d", "topic", "Learning & Skills");
  addFacet("training", "topic", "Learning & Skills");

  S.clients.forEach(function(c){ addFacet(c.name, "client", c.name); });
  S.people.forEach(function(p){ addFacet(p.name, "person", p.name); });
  /* A first name is only an alias when it belongs to exactly one person.
     With two Ahmeds, "ahmed" would silently resolve to whichever was added
     last and hide the other one's files. */
  var firsts = {};
  S.people.forEach(function(p){
    var f = String(p.name).split(" ")[0].toLowerCase();
    firsts[f] = (firsts[f] || 0) + 1;
  });
  S.people.forEach(function(p){
    var f = String(p.name).split(" ")[0];
    if (firsts[f.toLowerCase()] === 1) addFacet(f, "person", p.name);
  });

  FLAT_DOCTYPES.forEach(function(d){ addFacet(d, "docType", d); });
  addFacet("proposals", "docType", "Proposal");
  addFacet("rfp", "docType", "Proposal");
  addFacet("pitch", "docType", "Proposal");
  addFacet("deck", "docType", "Slide Deck");
  addFacet("slides", "docType", "Slide Deck");
  addFacet("contract", "docType", "Contract / SOW");
  addFacet("sow", "docType", "Contract / SOW");
  addFacet("cv", "docType", "CV / Biography");
  addFacet("bio", "docType", "CV / Biography");
  addFacet("resume", "docType", "CV / Biography");
  addFacet("case studies", "docType", "Case Study");
  addFacet("workbooks", "docType", "Workbook");

  INDUSTRIES.forEach(function(i){ addFacet(i, "industry", i); });
  addFacet("bank", "industry", "Banking & Finance");
  addFacet("banking", "industry", "Banking & Finance");
  addFacet("finance", "industry", "Banking & Finance");
  addFacet("gov", "industry", "Government");
  addFacet("govt", "industry", "Government");
  addFacet("hospital", "industry", "Healthcare");
  addFacet("health", "industry", "Healthcare");
  addFacet("oil", "industry", "Energy");

  LANGUAGES.forEach(function(l){ addFacet(l, "language", l); });

  addFacet("research", "library", "05 Research");
  addFacet("clients", "library", "01 Clients");
  addFacet("people", "library", "04 People");
  addFacet("facilitator", "library", "04 People");
  addFacet("facilitators", "library", "04 People");
  addFacet("trainer", "library", "04 People");
  addFacet("speaker", "library", "04 People");
  addFacet("who can", "library", "04 People");
  addFacet("archive", "library", "99 Archive");
  LIBS.forEach(function(L){ addFacet(L.id, "library", L.id); });

  FACETS.sort(function(a, b){ return b.p.length - a.p.length; });
}

var STOP = {};
"the a an for of in on to and or with we our us have has do did any what which how is are from by at that this it can deliver delivers show me find need want about all"
  .split(" ").forEach(function(w){ STOP[w] = 1; });

function clean(s){
  return " " + String(s || "").toLowerCase().replace(/[^a-z0-9&\s]/g, " ").replace(/\s+/g, " ").trim() + " ";
}

function parseQuery(q){
  var s = clean(q);
  var found = [];
  FACETS.forEach(function(f){
    var needle = clean(f.p);
    if (needle.trim().length < 2) return;
    if (s.indexOf(needle) > -1){
      for (var i = 0; i < found.length; i++){
        if (found[i].kind === f.kind && found[i].value === f.value) return;
      }
      found.push({ kind:f.kind, value:f.value });
      s = s.replace(needle, " ");
    }
  });
  var free = [];
  s.split(" ").forEach(function(t){
    if (t && !STOP[t] && t.length > 1 && free.indexOf(t) < 0) free.push(t);
  });
  return { facets: found, free: free };
}

var W = { title:10, topics:8, client:9, people:8, docType:6, industry:5,
          description:3, folderPath:2, library:1, language:4 };

function txt(r, f){
  var v = r[f];
  return String(v === null || v === undefined ? "" : v).toLowerCase();
}
function hasFacet(r, f){
  if (f.kind === "topic")    return txt(r, "topics").indexOf(f.value.toLowerCase()) > -1;
  if (f.kind === "person")   return txt(r, "people").indexOf(f.value.toLowerCase()) > -1;
  if (f.kind === "client")   return r.client === f.value;
  if (f.kind === "docType")  return r.docType === f.value;
  if (f.kind === "industry") return r.industry === f.value;
  if (f.kind === "library")  return r.library === f.value;
  if (f.kind === "language") return r.language === f.value;
  return false;
}

function scoreAll(parsed, raw){
  var recs = S.records || [];
  var groups = {};
  parsed.facets.forEach(function(f){ (groups[f.kind] = groups[f.kind] || []).push(f); });
  var kinds = Object.keys(groups);
  if (!kinds.length && !parsed.free.length) return [];

  return recs.map(function(r){
    var s = 0, sat = 0;

    kinds.forEach(function(k){
      var n = groups[k].filter(function(f){ return hasFacet(r, f); }).length;
      if (n){ sat++; s += 30 + (n - 1) * 10; }
    });

    var covered = 0;
    parsed.free.forEach(function(t){
      var any = false;
      Object.keys(W).forEach(function(fl){
        if (txt(r, fl).indexOf(t) > -1){ s += W[fl]; any = true; }
      });
      if (any) covered++;
    });

    if (raw && txt(r, "title").indexOf(raw) > -1) s += 30;
    if (kinds.length && sat < kinds.length) return { r:r, s:0 };
    if (parsed.free.length && covered / parsed.free.length < 0.6) return { r:r, s:0 };

    s += Math.max(0, (Number(r.year) || 2024) - 2023) * 2;
    if (r.status === "Superseded" || r.status === "Archived") s -= 40;
    return { r:r, s:s };
  }).filter(function(x){ return x.s > 0; })
    .sort(function(a, b){ return b.s - a.s || (Number(b.r.year)||0) - (Number(a.r.year)||0); });
}

function current(list){
  return list.filter(function(x){ return x.r.status !== "Superseded" && x.r.status !== "Archived"; });
}

/* The ladder. Each rung is tried only when the one above found nothing, so
   the page is never blank while a relevant file exists. */
function runSearch(q, facetsIn){
  var parsed = facetsIn ? { facets: facetsIn.facets, free: facetsIn.free } : parseQuery(q);
  var raw = String(q || "").toLowerCase().trim();
  var recs = S.records || [];

  if (!parsed.facets.length && !parsed.free.length) return { hits: [], mode: "empty", parsed: parsed };

  /* 1 — everything asked for, current files */
  var scored = scoreAll(parsed, raw);
  var live = current(scored);
  if (live.length) return { hits: live, mode: "exact", parsed: parsed };

  /* 2 — same, but the only matches are older versions */
  if (scored.length) return { hits: scored, mode: "old", parsed: parsed };

  /* 3 — a word was read as a tag when it was just a word.
     "cohort design facilitator mix" reads "facilitator" as the People
     library and finds nothing; as plain words it finds the proposals. */
  if (parsed.facets.length){
    var words = [];
    clean(q).split(" ").forEach(function(t){
      if (t && !STOP[t] && t.length > 1 && words.indexOf(t) < 0) words.push(t);
    });
    if (words.length){
      var asWords = scoreAll({ facets: [], free: words }, raw);
      var liveWords = current(asWords);
      if (liveWords.length) return { hits: liveWords, mode: "words", parsed: { facets: [], free: words } };
      if (asWords.length)   return { hits: asWords,   mode: "old",   parsed: { facets: [], free: words } };
    }
  }

  /* 4 — drop to OR across the facets */
  if (parsed.facets.length > 1){
    var loose = recs.map(function(r){
      var s = 0;
      parsed.facets.forEach(function(f){ if (hasFacet(r, f)) s += 20; });
      return { r:r, s:s };
    }).filter(function(x){ return x.s > 0 && x.r.status !== "Superseded"; })
      .sort(function(a, b){ return b.s - a.s; });
    if (loose.length) return { hits: loose, mode: "closest", parsed: parsed };
  }

  return { hits: [], mode: "none", parsed: parsed };
}

/* Only ever turn a stored string into a clickable href if it is a Drive URL.
   A row could have been written by something other than this form. */
function safeLink(u){
  return /^https:\/\/(drive|docs)\.google\.com\//.test(String(u || ""));
}

function relatedTo(rec){
  var recs = S.records || [];
  var myTopics = String(rec.topics || "").split(",").map(function(s){ return s.trim(); }).filter(Boolean);
  var myPeople = String(rec.people || "").split(",").map(function(s){ return s.trim(); }).filter(Boolean);

  return recs.map(function(r){
    if (r.id === rec.id || r.status === "Superseded") return { r:r, s:0, why:[] };
    var s = 0, why = [];
    if (rec.client && r.client === rec.client){ s += 10; why.push("same client"); }
    var t = myTopics.filter(function(x){ return String(r.topics || "").indexOf(x) > -1; });
    if (t.length){ s += 6 * t.length; why.push("topic: " + t.join(", ")); }
    var p = myPeople.filter(function(x){ return String(r.people || "").indexOf(x) > -1; });
    if (p.length){ s += 4 * p.length; why.push("person: " + p.join(", ")); }
    if (rec.industry && r.industry === rec.industry && !rec.client){ s += 3; why.push("same industry"); }
    return { r:r, s:s, why:why };
  }).filter(function(x){ return x.s > 0; })
    .sort(function(a, b){ return b.s - a.s; })
    .slice(0, 6);
}

/* ---- retrieve UI ---- */

function loadRecords(){
  if (S.records || S.loadingRecords) return;
  if (!live()){ S.records = []; return; }
  S.loadingRecords = true;
  $("results").innerHTML = '<div class="spin">Loading the index\u2026</div>';
  api("records").then(function(d){
    S.loadingRecords = false;
    S.records = (d && d.records) || [];
    buildFacets();
    doSearch();
  }).catch(function(){
    S.loadingRecords = false;
    S.records = [];
    $("results").innerHTML = '<div class="spin">Could not load the index. Check your connection and reopen this tab.</div>';
  });
}

function doSearch(){
  var q = $("q").value;
  if (q !== S.lastQuery) S.removed = [];   /* a new question, a clean slate */
  S.lastQuery = q;
  var rb = $("readback"), out = $("results");
  rb.innerHTML = ""; out.innerHTML = "";

  if (!S.records){ return; }
  if (!String(q).trim()){
    out.innerHTML = '<div class="spin">' + (S.records.length ? S.records.length + " files indexed" : "Nothing recorded yet") + '</div>';
    return;
  }

  var parsed = parseQuery(q);
  parsed.facets = parsed.facets.filter(function(f){
    return S.removed.indexOf(f.kind + "|" + f.value) < 0;
  });

  var res = runSearch(q, parsed);

  /* readback — how the words were understood */
  var bar = el("div", "readback");
  parsed.facets.forEach(function(f){
    var b = el("button", "fchip");
    b.type = "button";
    b.appendChild(document.createTextNode(f.value));
    b.appendChild(el("em", null, "\u00D7"));
    b.title = "Remove this filter";
    b.addEventListener("click", function(){
      S.removed.push(f.kind + "|" + f.value);
      doSearch();
    });
    bar.appendChild(b);
  });
  parsed.free.forEach(function(t){
    bar.appendChild(el("span", "fchip free", '"' + t + '"'));
  });
  if (parsed.facets.length || parsed.free.length){
    bar.appendChild(el("span", "count", res.hits.length + (res.hits.length === 1 ? " result" : " results")));
    rb.appendChild(bar);
  }
  if (S.removed.length){
    var reset = el("button", "fchip free", "reset filters");
    reset.type = "button";
    reset.addEventListener("click", function(){ S.removed = []; doSearch(); });
    bar.appendChild(reset);
  }

  if (res.mode === "old")     rb.appendChild(el("div", "banner", "Only older versions match. A newer one may exist under a different name."));
  if (res.mode === "words")   rb.appendChild(el("div", "banner", "No file is tagged that way, so these match your words instead."));
  if (res.mode === "closest") rb.appendChild(el("div", "banner", "No exact match. Showing the closest files."));

  if (!res.hits.length){
    var none = el("div", "banner");
    none.textContent = "Nothing found. Read as: " +
      (parsed.facets.map(function(f){ return f.value; }).join(", ") || "\u2014") +
      (parsed.free.length ? '  plus "' + parsed.free.join(" ") + '"' : "") +
      ". Try fewer words.";
    out.appendChild(none);
    return;
  }

  var list = el("div", "results");
  res.hits.slice(0, 40).forEach(function(h){ list.appendChild(resultCard(h.r)); });
  out.appendChild(list);
}

function resultCard(r){
  var c = el("div", "res");

  var h = el("h3");
  h.appendChild(document.createTextNode(r.title || "(untitled)"));
  if (r.status === "Superseded" || r.status === "Archived") h.appendChild(el("span", "old", r.status));
  c.appendChild(h);

  var bits = [r.docType, r.library + " \u203A " + r.folderPath];
  if (r.client) bits.push(r.client);
  if (r.topics) bits.push(r.topics);
  c.appendChild(el("div", "meta", bits.filter(Boolean).join("  \u00B7  ")));

  if (r.description) c.appendChild(el("p", "desc", r.description));

  var acts = el("div", "acts");
  if (safeLink(r.driveLink)){
    var a = el("a", null, "Open in Drive");
    a.href = r.driveLink; a.target = "_blank"; a.rel = "noopener";
    acts.appendChild(a);
  }
  var relBox = el("div", "rel");
  relBox.hidden = true;
  var rb = el("button", null, "Related \u25B8");
  rb.type = "button";
  rb.addEventListener("click", function(){
    if (!relBox.hidden){ relBox.hidden = true; rb.textContent = "Related \u25B8"; return; }
    relBox.innerHTML = "";
    var rel = relatedTo(r);
    if (!rel.length){
      relBox.appendChild(el("div", "why", "Nothing else shares its client, topic or people."));
    } else {
      rel.forEach(function(x){
        var row = el("div", "r");
        if (safeLink(x.r.driveLink)){
          var link = el("a", null, x.r.title);
          link.href = x.r.driveLink; link.target = "_blank"; link.rel = "noopener";
          row.appendChild(link);
        } else {
          row.appendChild(document.createTextNode(x.r.title));
        }
        row.appendChild(el("div", "why", x.why.join("  \u00B7  ")));
        relBox.appendChild(row);
      });
    }
    relBox.hidden = false;
    rb.textContent = "Related \u25BE";
  });
  acts.appendChild(rb);
  c.appendChild(acts);
  c.appendChild(relBox);
  return c;
}

var tmr = null;
$("q").addEventListener("input", function(){
  clearTimeout(tmr);
  tmr = setTimeout(doSearch, 140);
});
Array.prototype.forEach.call(document.querySelectorAll("[data-eg]"), function(b){
  b.addEventListener("click", function(){
    $("q").value = b.getAttribute("data-eg");
    S.removed = [];
    doSearch();
  });
});

/* ============================================================
   BOOT
   ============================================================ */

function boot(){
  buildFacets();
  renderPicker();
  if (!live()) return;
  api("init").then(function(d){
    if (!d || !d.ok) return;
    S.clients = d.clients || [];
    S.people  = d.people  || [];
    S.folders = d.folders || {};
    S.next    = d.next || "";
    if (S.next){ $("chipId").textContent = S.next; $("chip").hidden = false; }
    buildFacets();
    renderPicker();
  }).catch(function(){ /* offline: the fixed folders still work */ });
}
boot();

window.__AKR = { S: S, safeLink: safeLink, parseQuery: parseQuery, runSearch: runSearch, relatedTo: relatedTo,
                 buildFacets: buildFacets, plan: plan, nearMatch: nearMatch, showTab: showTab,
                 doSearch: doSearch, renderRecord: renderRecord, renderPicker: renderPicker };
})();
</script>
